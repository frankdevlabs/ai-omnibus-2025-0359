# Document register — the SINGLE source of truth for every official document on the file.
# sources/README.md is its *rendered* table (edit this YAML, then mirror the table; never the table alone).
#
# Field reference:
#   id            stable institutional id (COM-…, ST-…, PE-…, OEIL-…, EDPB-EDPS-…, CON-…, CES-…)
#   title         quoted descriptive title
#   body          institution: Commission | Council | Parliament | EDPB-EDPS | ECB | EESC | <Member State> | …
#   date          ISO YYYY-MM-DD
#   limite        bool — true for Council LIMITE documents
#   url           authoritative URL (also: celex)
#   mirror        public copy when the authoritative URL is restricted (LIMITE)
#   register      Council register reference
#   national_parliament  national-parliament record hosting a LIMITE text
#   local / local_cover / local_annex / local_init / local_add1…  committed file path(s)
#   access        omit = fully public; else cite-only | screenshot-only | not-public |
#                 public-released | public-via-register | public-via-journalist | public-via-national-parliament
#   lead_source   credit for a Tier-2/3/external lead that surfaced the doc (name+handle, watchlist
#                 code, tip URL+date) — set when a register run was triggered by a tip, not a Tier-1 feed
#   leading_service / mandatory_consultees / notes   prose context (notes is a `>-` block)

documents:
  # --- Commission -----------------------------------------------------------
  - id: COM-2025-836
    title: "Digital Omnibus on AI — proposal for a Regulation amending Regulations (EU) 2024/1689 (AI Act) and (EU) 2018/1139 as regards the simplification of the implementation of harmonised rules on artificial intelligence"
    body: Commission
    date: 2025-11-19
    limite: false
    url: https://digital-strategy.ec.europa.eu/en/library/digital-omnibus-ai-regulation-proposal
    celex: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0836
    local: sources/commission/COM-2025-836_proposal_2025-11-19.pdf
    leading_service: "Lead service DG CNECT; responsible Commissioner Valdis Dombrovskis."
    mandatory_consultees: European Economic and Social Committee; European Central Bank consulted (CON/2026/10)
    notes: >-
      The proposal this repo tracks — the AI half of the 19 Nov 2025 Digital Omnibus package
      (the data/cyber half is COM(2025) 837, file 2025/0360 (COD), tracked in the sibling repo).
      An AMENDING act: Article 1 amends the AI Act 2024/1689 (application-date postponements via a
      conditional standards-availability mechanism, registration and bias-data easements, SME
      reliefs, watermarking transition), Article 2 the aviation Regulation 2018/1139. Legal basis
      Art 114 TFEU. Deliberately split off and fast-tracked because the AI Act high-risk
      obligations would apply from 2 Aug 2026. Accompanied by SWD(2025) 836.
      Digest: docs/commission-proposal.md; operative text: extracts/commission/.

