  # --- Advisory bodies ---------------------------------------------------------
  - id: EDPB-EDPS-JO-1-2026
    title: "EDPB–EDPS Joint Opinion 1/2026 on the Digital Omnibus proposals"
    body: EDPB-EDPS
    date: 2026-01-20
    limite: false
    url: https://www.edpb.europa.eu/our-work-tools/our-documents/edpbedps-joint-opinion/edpb-edps-joint-opinion-12026-proposal_en
    local: sources/edpb-edps/EDPB-EDPS-JO-1-2026_joint-opinion_2026-01-20.pdf
    notes: >-
      Adopted 20 Jan 2026, published 21 Jan. Supports simplification but warns against weakening
      fundamental-rights safeguards: keep "strict necessity" for special-category bias data, keep
      the registration duty (dropping it would give providers "an undesirable incentive ... to
      unduly invoke this exemption"), and minimise any timeline delay. Largely followed by Council
      and EP. Digest: docs/advisory/edpb-edps-jo-1-2026.md.

