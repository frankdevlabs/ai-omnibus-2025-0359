# ============================================================================
# tracker.yaml — the SINGLE source of truth for this tracker's file identity.
#
# This is the one place that says *which* EU file this repo follows. Everything
# else (CLAUDE.md, README.md, STATUS.md, the skills' scope checks) reads from
# here or is filled from here by `python3 bootstrap.py`.
#
# This tracker follows file 2025/0359 (COD) — the Digital Omnibus on AI
# ("AI Omnibus"), the AI-Act half of the Digital Omnibus package (19 Nov 2025).
# ============================================================================

# --- Identity ---------------------------------------------------------------
file_id: "2025/0359 (COD)"                # interinstitutional file number + procedure type
short_name: "Digital Omnibus on AI (AI Omnibus)"
strand: "Targeted amendments to the AI Act 2024/1689: postponed high-risk application dates (Annex III -> 2 Dec 2027, Annex I -> 2 Aug 2028), new Art 5 nudifier/CSAM prohibition, Art 50(2) watermarking transition, registration & bias-data rules, SMC simplifications, Annex I sectoral interaction, AI Office powers; plus technical amendments to aviation Regulation 2018/1139"

proposal:
  id: "COM(2025) 836"                     # Commission proposal id (without "final")
  date: "2025-11-19"                      # ISO
  swd: "SWD(2025) 836"                    # accompanying staff working doc
  celex: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52025PC0836"
  oeil: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0359(COD)"

# Sibling file(s) that are easy to confuse with this one and must NOT be tracked
# here. Drives the scope-guard text in CLAUDE.md/README and the skills' scope rule.
keep_apart:
  - file_id: "2025/0360 (COD)"
    note: "Digital Omnibus (data/cyber) — COM(2025) 837, the GDPR/ePrivacy/NIS2 half of the same 19 Nov 2025 package; tracked in the sibling repo digital-omnibus-2025-0360 and on a slower, separate trajectory"
# Also distinct: 2026/0138 (COD) CADA (cloud/AI industrial policy, tracked in
# cada-2026-0138) and the package's non-legislative parts (European Business
# Wallets proposal, Digital Fitness Check).

legal_bases: ["Article 114 TFEU"]         # OLP per Article 294 TFEU

# Existing laws this file amends/repeals. Drives docs/instruments/ pages.
instruments:
  - { name: "AI Act", celex: "2024/1689" }
  - { name: "EASA Basic Regulation (aviation)", celex: "2018/1139" }

# The per-version operative-text file set under extracts/. EACH text version
# gets one file per slice so `git diff` between versions lines up.
# This is an AMENDING act: Article 1 carries the AI Act amendments (points
# (1)...(n)), Article 2 the aviation amendments. Slices are THEME-based,
# grouping Article 1 points by the AI Act provisions they touch.
# PROVISIONAL until verified against COM(2025) 836's actual point structure
# during transcription of the Commission baseline.
extract_slices:
  - ai-literacy-art4                 # Art 4 AI literacy (binding duty vs encouragement framework)
  - prohibitions-art5                # new Art 5 ban: nudifier apps / AI-generated CSAM (EP+Council addition)
  - bias-data-art4a                  # special-category data for bias detection ("strict necessity" standard)
  - high-risk-classification-art6    # Art 6 + Annex I/III classification, "safety component" definition
  - registration-art49-annexviii     # registration of self-assessed non-high-risk systems, Annex VIII Section B
  - transparency-art50               # Art 50(2) watermarking transition + other transparency duties
  - sandboxes-testing-art57          # regulatory sandboxes (deadline 2 Aug 2027), real-world testing
  - governance-aioffice-art75        # AI Office exclusive powers (GPAI-built systems, VLOPs/VLOSEs), enforcement tools
  - smc-simplifications              # SME reliefs extended to small mid-caps
  - sectoral-annexi-interaction      # Annex I product law: machinery equivalence clause, delegated/implementing acts
  - application-dates                # amended application/transition dates (Art 111/113 of the AI Act)
  - aviation-reg-2018-1139           # Article 2 of the omnibus: Regulation (EU) 2018/1139 amendments
  - final-provisions                 # entry into force, remaining horizontal points
  - recitals

# OLP actor skeleton for STATUS.md "Where each institution stands".
co_legislators:
  council:
    config: "Telecom Working Party; Cyprus presidency until 30 Jun 2026, Ireland from 1 Jul 2026"
  parliament:
    committees_responsible: ["IMCO", "LIBE"]   # joint, Rule 58, committee file CJ40/10/04577
    committees_opinion: ["JURI", "CULT", "TRAN"]  # ITRE and BUDG gave no opinion

# Advisory bodies that must be / have been consulted (drives the STATUS advisory table).
advisory_bodies: ["EDPB-EDPS", "EESC", "ECB"]

