# Link-checker config. Internal relative links (incl. the committed PDFs) are checked normally.
# External hosts that bot-block or that we cite by number rather than assert as live are excluded.
# 415 = WAF rejecting lychee's HEAD probe (the host serves the page fine to a GET/browser).
accept = [200, 202, 206, 403, 415, 429]
max_retries = 3
retry_wait_time = 2
timeout = 30
# Placeholder templates carry <PLACEHOLDER> link destinations, not real links — don't scan them.
exclude_path = ["STATUS.template.md"]
exclude = [
  "^https://data\\.consilium\\.europa\\.eu",   # register 404s for unreleased LIMITE docs (cited by number)
  "^https://eur-lex\\.europa\\.eu",            # returns 202 to automated clients
  "^https://oeil\\.europarl\\.europa\\.eu",    # bot-sensitive
  "^https://www\\.linkedin\\.com",             # blocks automated access
  "^https://ec\\.europa\\.eu/commission/presscorner",  # bot-sensitive press host (cited by IP number)
  "^https://www\\.consilium\\.europa\\.eu",    # browser-check page blocks automated clients (press releases cited by number)
  "^https://iapp\\.org",                       # bot-blocks automated clients
  "^https://zoek\\.officielebekendmakingen\\.nl",  # bot-sensitive NL register/RSS (cited by query/dossier)
  "^https://ieu-monitoring\\.com",             # T2 editorial host — slow/bot-sensitive, times out (cited by URL)
  "^http://data\\.europa\\.eu",                # ELI identifiers (Reg (EU) 2026/1744) — persistent URIs, not fetchable pages
  "^https://www\\.beuc\\.eu",                  # resets the connection for automated clients (stakeholder open letters)
  "^https://cdt\\.org",                        # WAF rejects HEAD (415)
]
